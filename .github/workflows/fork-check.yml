name: Fork Quality & Divergence Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history required for divergence check against base commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify environment
        run: python scripts/verify-env.py

      # The fork shares no history with upstream: the reviewed base commit only exists there.
      - name: Fetch upstream base
        run: git fetch --no-tags https://github.com/KKKKhazix/AIHOT.git main

      - name: Upstream divergence check
        run: python tools/check_divergence.py

      - name: Fork divergence contract tests
        run: python tests/test_fork_divergence.py

      - name: Dependency freshness checker tests
        run: python tests/test_dependency_freshness.py

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build -w @aihot/web

      # Web tests need Playwright browsers and are already run in full by the upstream-held check.yml;
      # running them here without the browsers hangs until the job timeout.
