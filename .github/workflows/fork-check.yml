name: Fork Quality & Divergence Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history required for divergence check against base commit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify environment
        run: python scripts/verify-env.py

      - name: Upstream divergence check
        run: python tools/check_divergence.py

      - name: Fork divergence contract tests
        run: python tests/test_fork_divergence.py

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build -w @aihot/web

      - name: Web tests
        run: node --test apps/web/tests/*.test.ts
